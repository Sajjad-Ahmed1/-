name: Deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Rebuild welcome video
        shell: bash
        run: |
          rm -f dist/assets/welcome.mp4
          touch dist/assets/welcome.mp4
          for i in $(seq 0 62); do
            n=$(printf "%02d" "$i")
            if [ "$i" = "0" ] || [ "$i" = "57" ] || [ "$i" = "58" ]; then
              for j in $(seq 0 4); do cat "dist/assets/intro/chunk${n}_${j}.bin" >> dist/assets/welcome.mp4; done
            else
              cat "dist/assets/intro/chunk${n}.bin" >> dist/assets/welcome.mp4
            fi
          done
          test "$(stat -c%s dist/assets/welcome.mp4)" = "15501469"
          echo "9aa61983de3adc08f27bc438776eb7903ea84c135743ef80a60655689b5410f9  dist/assets/welcome.mp4" | sha256sum -c -
      - name: Save streamable video in repository
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f dist/assets/welcome.mp4
          if ! git diff --cached --quiet; then
            git commit -m "Add streamable welcome video"
            git push
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
