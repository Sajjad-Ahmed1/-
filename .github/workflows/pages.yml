name: Deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Rebuild welcome video
        shell: bash
        run: |
          rm -f dist/assets/welcome.mp4
          touch dist/assets/welcome.mp4
          for i in $(seq 0 62); do
            n=$(printf "%02d" "$i")
            if [ "$i" = "0" ] || [ "$i" = "57" ] || [ "$i" = "58" ]; then
              for j in $(seq 0 4); do cat "dist/assets/intro/chunk${n}_${j}.bin" >> dist/assets/welcome.mp4; done
            else
              cat "dist/assets/intro/chunk${n}.bin" >> dist/assets/welcome.mp4
            fi
          done
          test "$(stat -c%s dist/assets/welcome.mp4)" = "15501469"
          echo "9aa61983de3adc08f27bc438776eb7903ea84c135743ef80a60655689b5410f9  dist/assets/welcome.mp4" | sha256sum -c -
      - name: Prepare mobile-compatible streaming videos
        shell: bash
        run: |
          if ! command -v ffmpeg >/dev/null; then sudo apt-get update -qq && sudo apt-get install -y ffmpeg; fi
          for source in welcome art; do
            output="dist/assets/${source}-play.mp4"
            if [ ! -s "$output" ]; then
              ffmpeg -hide_banner -loglevel error -y -i "dist/assets/${source}.mp4" -map 0:v:0 -map 0:a:0? -vf "scale=trunc(iw/2)*2:trunc(ih/2)*2" -c:v libx264 -preset fast -crf 23 -pix_fmt yuv420p -c:a aac -b:a 128k -movflags +faststart "$output"
            fi
            ffprobe -v error -show_entries stream=codec_name,pix_fmt,width,height -show_entries format=duration -of json "$output"
            ffmpeg -v error -xerror -i "$output" -f null -
          done
          node --check dist/app.js
          node --check dist/experience.js
      - name: Save compatible videos in repository
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f dist/assets/welcome.mp4 dist/assets/welcome-play.mp4 dist/assets/art-play.mp4
          if ! git diff --cached --quiet; then
            git commit -m "Prepare H264 AAC videos for mobile playback"
            git pull --rebase origin main
            git push
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
