name: Verify live video playback
on:
  push:
    branches: [main]
    paths: ['tests/check-site.cjs', '.github/workflows/check-site.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install browser
        run: |
          npm install --prefix "$RUNNER_TEMP/browser-check" playwright
          "$RUNNER_TEMP/browser-check/node_modules/.bin/playwright" install --with-deps chromium
      - name: Check published page and play videos
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/browser-check/node_modules/playwright
        run: node tests/check-site.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-check-screens
          path: site-*.png
